label{display:block;font-size:.9rem;color:var(--mu);margin-bottom:12px;font-weight:600}

.btn{font:inherit;font-weight:600;background:linear-gradient(135deg,var(--g1),var(--g2));color:var(--btx);border:0;border-radius:999px;padding:11px 20px;cursor:pointer;margin:0 8px 10px 0;box-shadow:0 4px 0 rgba(0,0,0,.18)}

.btn.alt{background:var(--card);color:var(--lk);border:2px solid var(--ac);box-shadow:0 4px 0 var(--bd)}
.btn:disabled{opacity:.45;cursor:default}
.mu{color:var(--mu);font-size:.85rem}
a{color:var(--lk)}
.stage{position:relative;width:100%;max-width:640px;margin:0 auto 8px;aspect-ratio:4/3;background:#000;border-radius:26px;overflow:hidden;border:6px solid var(--a3);box-shadow:0 0 0 4px var(--a5),0 8px 0 4px var(--bd)}

.stats{display:flex;gap:12px;flex-wrap:wrap;margin:8px 0}

.stats b{font-size:1.5rem;display:block;color:var(--lk)}
ol{padding-left:0;list-style:none;counter-reset:s}
li{counter-increment:s;margin-bottom:10px;padding:8px 12px 8px 46px;position:relative;border-radius:16px;background:var(--c1)}
li:nth-child(2n){background:var(--c2)}li:nth-child(3n){background:var(--c3)}
li::before{content:counter(s);position:absolute;left:10px;top:8px;width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,var(--g1),var(--g2));color:var(--btx);font-weight:700;display:flex;align-items:center;justify-content:center;font-size:.9rem}

const $=id=>document.getElementById(id);
let L=1;
try{const s=localStorage.getItem('lang');if(s!==null)L=+s;else{const n=navigator.language||'';L=n.startsWith('ko')?2:n.startsWith('zh')?0:1}}catch(e){}
const t=k=>S[k][L];
const F={name:'fName',goal:'fGoal',theme:'fTheme',side:'fSide',diff:'fDiff',size:'fSize',time:'fTime'};
function apply(){
 document.documentElement.lang=['zh','en','ko'][L];$('lang').value=L;
 document.querySelectorAll('[data-i]').forEach(e=>e.textContent=t(e.dataset.i));
 if(!$('fName').dataset.u&&!$('fName').value)$('fName').placeholder=['我的第一个游戏','My first game','나의 첫 게임'][L];
 if($('plan').style.display!=='none')gen();
}
function show(id){
 document.querySelectorAll('section').forEach(s=>s.classList.toggle('on',s.id===id));
 document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===id));
 if(id!=='play')stopCam();window.scrollTo(0,0);
}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>show(b.dataset.tab));
document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>show(b.dataset.go));
$('lang').onchange=e=>{L=+e.target.value;try{localStorage.setItem('lang',L)}catch(x){}apply()};

// ---- design
function D(){return{name:$('fName').value.trim(),goal:+$('fGoal').value,theme:+$('fTheme').value,side:+$('fSide').value,diff:+$('fDiff').value,size:+$('fSize').value,time:+$('fTime').value,adapt:$('fAdapt').checked}}
function sync(){$('vDiff').textContent=$('fDiff').value;$('vSize').textContent=$('fSize').value}
function gen(){
 const d=D();$('plan').style.display='block';
 $('planName').textContent=(d.name||['我的第一个游戏','My first game','나의 첫 게임'][L])+' · '+[t('g1'),t('g2'),t('g3')][d.goal]+' · '+[t('th1'),t('th2'),t('th3')][d.theme]+' · '+[t('s1'),t('s2'),t('s3')][d.side];
 $('planLine').textContent=t('pl').replace('{d}',d.diff).replace('{s}',d.size).replace('{t}',d.time).replace('{a}',d.adapt?t('yes'):t('no'));
 $('planTip').textContent=t('tip'+d.goal);
 try{localStorage.setItem('design',JSON.stringify(d))}catch(e){}
}
$('bGen').onclick=gen;
['fDiff','fSize'].forEach(i=>$(i).oninput=sync);
try{const s=JSON.parse(localStorage.getItem('design')||'null');if(s){$('fName').value=s.name||'';$('fGoal').value=s.goal;$('fTheme').value=s.theme;$('fSide').value=s.side;$('fDiff').value=s.diff;$('fSize').value=s.size;$('fTime').value=s.time;$('fAdapt').checked=!!s.adapt}else{$('fDiff').value=2;$('fSize').value=55;$('fTime').value=60;$('fAdapt').checked=true}}catch(e){$('fDiff').value=2;$('fSize').value=55;$('fTime').value=60}
sync();

// ---- camera + game
const cv=$('cv'),cx=cv.getContext('2d'),vid=$('vid'),sm=document.createElement('canvas');sm.width=64;sm.height=48;
const sx=sm.getContext('2d',{willReadFrequently:true});
let stream=null,prev=null,mm=new Uint8Array(64*48),G=null,rec=null,chunks=[],blob=null,raf=0,pvUrl=null;
async function startCam(){
 try{
  stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:640,height:480},audio:false});
  vid.srcObject=stream;await vid.play();$('bPlay').disabled=false;$('camMsg').textContent='';prev=null;loop();
 }catch(e){$('camMsg').textContent=t('camErr')}
}
function stopCam(){
 if(G)endGame(true);cancelAnimationFrame(raf);
 if(stream){stream.getTracks().forEach(x=>x.stop());stream=null}
 $('bPlay').disabled=true;cx.clearRect(0,0,640,480);
}
$('bCam').onclick=()=>{if(!stream)startCam()};
function motion(){
 sx.setTransform(-1,0,0,1,64,0);sx.drawImage(vid,0,0,64,48);
 const d=sx.getImageData(0,0,64,48).data,g=new Uint8Array(3072);
 for(let i=0;i<3072;i++){const v=(d[i*4]*77+d[i*4+1]*150+d[i*4+2]*29)>>8;g[i]=v;mm[i]=prev&&Math.abs(v-prev[i])>28?1:0}
 prev=g;
}
function hit(b){
 const x0=Math.max(0,Math.floor((b.x-b.r)/10)),x1=Math.min(63,Math.floor((b.x+b.r)/10)),y0=Math.max(0,Math.floor((b.y-b.r)/10)),y1=Math.min(47,Math.floor((b.y+b.r)/10));
 let n=0,m=0;for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){m++;n+=mm[y*64+x]}
 return m>0&&n/m>0.22;
}
function spawn(){
 const d=G.d,r=d.size*Math.pow(.93,G.lvl),lo=d.side===2?320+r:r,hi=d.side===1?320-r:640-r;
 G.b.push({x:lo+Math.random()*(hi-lo),y:60+r+Math.random()*(480-120-2*r),r,t:performance.now()});
}
function life(){return Math.max(900,(6200-G.d.diff*950)*Math.pow(.88,G.lvl))}
function outcome(ok){
 ok?G.hits++:G.miss++;G.next=performance.now()+350;
 if(G.d.adapt){G.h.push(ok?1:0);if(G.h.length>=5){const r=G.h.reduce((a,b)=>a+b)/5;if(r>=.8&&G.lvl<4)G.lvl++;else if(r<=.4&&G.lvl>-3)G.lvl--;G.h=[]}}
}
function loop(){
 raf=requestAnimationFrame(loop);
 if(!stream||vid.readyState<2)return;
 cx.save();cx.translate(640,0);cx.scale(-1,1);cx.drawImage(vid,0,0,640,480);cx.restore();
 motion();
 if(!G)return;
 const now=performance.now(),el=(now-G.start)/1000,E=['🎈','⭐','🍎'][G.d.theme];
 if(el>=G.d.time){endGame(false);return}
 while(G.b.length<2&&now>G.next)spawn();
 for(const b of G.b.slice()){
  if(now-b.t>400&&hit(b)){G.b.splice(G.b.indexOf(b),1);G.fx.push({x:b.x,y:b.y,t:now});outcome(true);continue}
  const f=(now-b.t)/life();
  if(f>=1){G.b.splice(G.b.indexOf(b),1);outcome(false);continue}
  cx.beginPath();cx.arc(b.x,b.y,b.r,0,7);cx.fillStyle=['rgba(255,122,168,.45)','rgba(92,207,176,.45)','rgba(255,201,77,.5)'][G.d.theme];cx.fill();
  cx.beginPath();cx.arc(b.x,b.y,b.r+4,-1.57,-1.57+6.28*(1-f));cx.strokeStyle='#ffd23f';cx.lineWidth=5;cx.stroke();
  cx.font=(b.r*1.5)+'px serif';cx.textAlign='center';cx.textBaseline='middle';cx.fillStyle='#000';cx.fillText(E,b.x,b.y+2);
 }
 G.fx=G.fx.filter(f=>now-f.t<600);for(const f of G.fx){const k=(now-f.t)/600;cx.globalAlpha=1-k;cx.font=(30+50*k)+'px serif';cx.textAlign='center';cx.textBaseline='middle';cx.fillText('✨',f.x,f.y-20*k);cx.fillText('🎉',f.x+30*k,f.y-30*k)}cx.globalAlpha=1;
 cx.fillStyle='rgba(90,50,140,.7)';cx.fillRect(0,0,640,40);cx.fillStyle='#fff';cx.font='20px system-ui,sans-serif';cx.textAlign='left';cx.textBaseline='middle';
 cx.fillText('✔ '+G.hits+'   ✖ '+G.miss+'   Lv '+G.lvl,12,20);cx.textAlign='right';cx.fillText(t('tL')+' '+Math.ceil(G.d.time-el)+'s',628,20);
}
$('bPlay').onclick=()=>{
 if(!stream||G)return;
 const d=D();gen();
 G={d,hits:0,miss:0,lvl:0,h:[],b:[],fx:[],next:0,start:performance.now()};
 $('res').style.display='none';$('pv').style.display='none';$('bSave').style.display='none';blob=null;
 if($('fRec').checked&&window.MediaRecorder){
  try{
   const mt=['video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'].find(m=>MediaRecorder.isTypeSupported(m));
   chunks=[];rec=new MediaRecorder(cv.captureStream(30),mt?{mimeType:mt}:undefined);
   rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};
   rec.onstop=()=>{if(!chunks.length)return;blob=new Blob(chunks,{type:'video/webm'});if(pvUrl)URL.revokeObjectURL(pvUrl);pvUrl=URL.createObjectURL(blob);$('pv').src=pvUrl;$('pv').style.display='block';$('bSave').style.display='inline-block';$('recMsg').textContent=''};
   rec.start();
  }catch(e){rec=null}
 }else{rec=null}
 $('bPlay').disabled=true;
};
function endGame(silent){
 const g=G;G=null;
 if(rec&&rec.state!=='inactive')rec.stop();
 if(!stream)return;$('bPlay').disabled=false;
 if(silent||!g)return;
 const n=g.hits+g.miss;
 $('rHit').textContent=g.hits;$('rMiss').textContent=g.miss;$('rAcc').textContent=(n?Math.round(100*g.hits/n):0)+'%';$('rLvl').textContent=g.lvl;
 $('res').style.display='block';
 $('recMsg').textContent=(!rec&&$('fRec').checked&&!window.MediaRecorder)?t('noRec'):'';
 $('res').scrollIntoView({behavior:'smooth'});
}
$('bSave').onclick=async()=>{
 if(!blob)return;
 try{
  const d=new Date(),p=n=>String(n).padStart(2,'0');
  const fn='cp-session-'+d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+'-'+p(d.getHours())+p(d.getMinutes())+'.webm';
  const dl=(window.claude&&claude.use)?await claude.use('downloads'):null;
  if(dl){await dl.save({filename:fn,data:blob})}
  else{const a=document.createElement('a');a.href=pvUrl;a.download=fn;document.body.appendChild(a);a.click();a.remove()}
  $('recMsg').textContent='';
 }catch(e){$('recMsg').textContent=t('saveErr')}
};

apply();show('home');
</script></body></html>
